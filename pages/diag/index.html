<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>记忆与生活线 · 诊断</title>
<style>
  body{font:14px/1.7 -apple-system,"PingFang SC",sans-serif;background:#fdf8f2;color:#2b2622;
       margin:0;padding:22px;max-width:820px}
  h1{font-size:16px;margin:0 0 4px}
  .muted{color:#8b8079;font-size:12px;margin-bottom:18px}
  pre{background:#fffdfa;border:1px solid #eadfd3;border-radius:10px;padding:12px 14px;
      font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;margin:0 0 12px}
  b{color:#c4674a}
</style>
</head>
<body>
<h1>诊断页</h1>
<div class="muted">这个页面只做一件事：把“为什么连不上”说清楚。把下面所有内容截图或复制给我。</div>
<pre id="log">启动中…</pre>
<script>
(function () {
  const out = document.getElementById("log");
  const lines = [];
  function p(s) { lines.push(s); out.textContent = lines.join("\n"); }

  p("1. 页面已执行（能看到这行说明脚本没崩）");
  p("   URL: " + location.href.slice(0, 120));
  p("   charset: " + document.characterSet);
  p("   origin: " + (location.origin || "null"));

  function tryCall(label, fn) {
    try {
      const r = fn();
      p(label + " 存在 → " + (typeof r));
      return r;
    } catch (e) {
      p(label + " 调用失败 → " + e);
      return null;
    }
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  (async function () {
    p("");
    p("2. 桥接检测（每 200ms 一次，最多 5 秒）");
    let b = null;
    for (let i = 0; i < 25; i++) {
      b = window.AstrBotPluginPage || null;
      if (b) { p("   第 " + (i + 1) + " 次检测到 AstrBotPluginPage"); break; }
      await wait(200);
    }
    if (!b) {
      p("   <b>5 秒内没有出现 AstrBotPluginPage</b>");
      p("   window.AstrBotPluginView = " + (typeof window.AstrBotPluginView));
      p("   → SDK 没注入，或注入了但名字不对");
      return;
    }

    p("   可用方法: " + Object.keys(b).join(", "));
    tryCall("   b.ready()", () => b.ready());

    p("");
    p("3. 握手（最多 3 秒，失败也继续）");
    try {
      const r = await Promise.race([b.ready(), wait(3000).then(() => "timeout")]);
      p("   结果: " + (r === "timeout" ? "超时（父窗口没有回话）" : "成功"));
    } catch (e) { p("   握手抛错: " + e); }

    p("");
    p("4. 调接口 overview（最多 8 秒）");
    try {
      const data = await Promise.race([
        b.apiGet("overview", {}),
        wait(8000).then(() => { throw new Error("超时 8 秒，父窗口没回"); }),
      ]);
      p("   成功。人格字数 = " + (data && data.persona_len) + "，此刻 = " + (data && data.now));
    } catch (e) {
      p("   <b>失败: " + (e && e.message ? e.message : e) + "</b>");
    }
    p("");
    p("5. 诊断结束。把以上全部内容发我。");
  })();
})();
</script>
</body>
</html>
