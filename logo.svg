<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="记忆与生活线">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4ea"/>
      <stop offset="1" stop-color="#efe2d1"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f7f0e6"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- 淡淡的暖光 -->
    <circle cx="120" cy="96" r="190" fill="#2f6d5e" opacity="0.06"/>
    <circle cx="430" cy="440" r="170" fill="#b8873f" opacity="0.09"/>

    <!-- 卡片：记忆的载体 -->
    <g transform="translate(96 112)">
      <rect x="0" y="0" width="320" height="288" rx="30" fill="url(#card)" stroke="#e3d4c3" stroke-width="3"/>
      <!-- 左侧色条：情绪 -->
      <rect x="26" y="40" width="9" height="208" rx="4.5" fill="#2f6d5e"/>
      <!-- 换行文字 -->
      <rect x="58" y="56" width="150" height="14" rx="7" fill="#cbbba8"/>
      <rect x="58" y="86" width="216" height="14" rx="7" fill="#dccfbe"/>
      <!-- 生活线：起伏 -->
      <path d="M58 176 H104 L124 140 L150 214 L176 160 L196 176 H262"
            fill="none" stroke="#b8873f" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 记忆的点 -->
      <circle cx="262" cy="176" r="13" fill="#c4674a"/>
    </g>

    <!-- 书签 -->
    <path d="M330 112 h56 v96 l-28 -24 l-28 24z" fill="#b8873f" opacity="0.92"/>
  </g>
</svg>
